name: Color guide

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tjg-docs:
    name: Build color guide
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.12'

    - name: Install documentation tools
      run: |
        sudo apt-get update
        sudo apt-get install --yes doxygen
        python -m pip install --require-hashes -r support/doc-requirements.txt

    - name: Build color guide
      env:
        PYTHONPATH: support/python
      run: >-
        python -m mkdocs build --config-file support/mkdocs-pages.yml
        --site-dir "$GITHUB_WORKSPACE/build/doc-html" --no-directory-urls
