name: TJG Windows

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: MSVC v143 C++23 x64 ${{ matrix.build_type }} SGR=${{ matrix.compact }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        compact: ["ON", "OFF"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set timezone
        run: tzutil /s "FLE Standard Time"

      - name: Configure TJG
        run: >-
          cmake -S tjg -B build/tjg -G "Visual Studio 17 2022" -A x64 -T v143
          -DCMAKE_CXX_STANDARD=23 -DCMAKE_CXX_STANDARD_REQUIRED=ON
          -DTJG_TEST=ON -DTJG_WERROR=ON
          -DTJG_COLOR_COMPACT_SGR=${{ matrix.compact }}

      - name: Build TJG tests
        run: cmake --build build/tjg --config ${{ matrix.build_type }} --parallel 4

      - name: Test TJG
        run: ctest --test-dir build/tjg -C ${{ matrix.build_type }} -L tjg --output-on-failure
