name: codeql

on:
  push:
    branches: [main, ref/CPP20]
  pull_request:
    branches: [main, ref/CPP20]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compact: ["ON", "OFF"]
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v3.29.5
      with:
        languages: c-cpp
        build-mode: manual

    - name: Install C++23 toolchain
      run: |
        sudo apt-get update
        sudo apt-get install --yes g++-14 ninja-build

    - name: Build TJG tests for analysis
      env:
        CXX: g++-14
      run: |
        cmake -S tjg -B build/tjg -G Ninja -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_STANDARD=23 -DCMAKE_CXX_STANDARD_REQUIRED=ON \
          -DTJG_TEST=ON -DTJG_WERROR=ON -DTJG_COLOR_COMPACT_SGR=${{ matrix.compact }}
        cmake --build build/tjg --parallel 4

    - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v3.29.5
      with:
        category: /language:c-cpp/sgr-${{ matrix.compact }}
