name: C++23 diagnostic checks
on:
  push:
    branches: [Refactor]
  pull_request:
    branches: [Refactor]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  libcxx:
    # This is the locally reproducible diagnostic matrix, not certification of
    # the latest-stable GCC/Clang release matrix described in CXX23.md.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install diagnostic toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 libc++-19-dev libc++abi-19-dev
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_CXX_COMPILER=clang++-19
          -DCMAKE_CXX_FLAGS="-stdlib=libc++ -Wall -Wextra -Wpedantic -Werror"
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build and test
        run: |
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
